<style>
        body { font-family: 'Manrope', sans-serif; }
        .waveform-bar {
            width: 3px;
            background-color: currentColor;
            border-radius: 99px;
            opacity: 0.7;
            animation: pulse 1s infinite alternate ease-in-out;
        }
        @keyframes pulse {
            0% { transform: scaleY(0.4); }
            100% { transform: scaleY(1); }
        }
        .waveform-bar:nth-child(even) { animation-delay: 0.2s; }
        .waveform-bar:nth-child(3n) { animation-delay: 0.4s; }
        .waveform-bar:nth-child(4n) { animation-delay: 0.1s; }
        .waveform-bar:nth-child(5n) { animation-delay: 0.5s; }
        
        /* Hide scrollbar for clean chat look */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

</div>
<!-- Partner Message: Text -->

<img class="w-8 h-8 rounded-full object-cover flex-shrink-0 shadow-sm border border-outline-variant/30 mb-1" data-alt="A softly lit, intimate portrait photograph of a young woman with a warm, genuine smile. The lighting is natural and bright, evoking a romantic and premium editorial aesthetic consistent with a high-end lifestyle journal. Colors lean towards warm neutral tones." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNJSeh9ee1r15CLr5g7zuS2ZSGtKfQ9mdA-QStSZahY_66i6V43Jg2r38BqKHF_EGtIcTrFzkLFMaU1uq9Qwwi3vXFTbuII1lr4RZo88LKkqSZWX9-ldjQTXy49b1dO4_sPBmERU64Hp4jWDLjwjgKEp7bn3hTPTyUNw9qMJpPRARnQFxIXInlRMvjIZOXJyRLunKyG5tsTNGVs4pngQE-RZTRsIK_MwH4TKg5WMM1XmSiXM1WvIn0"/>

                    Just saw the cutest dog on my way home! Reminded me of our walk yesterday.
                </div>
<!-- Heart Reaction -->
<div class="absolute -bottom-2 -right-2 bg-surface p-1 rounded-full shadow-sm border border-outline-variant/20 flex items-center justify-center transform group-hover:scale-110 transition-transform">

</div>
</div>
