<!-- Interaction Script -->
<script>
        let pin = "";
        const MAX_PIN_LENGTH = 4;
        const dots = document.querySelectorAll('.pin-dot');

        function updateDots() {
            dots.forEach((dot, index) => {
                if (index < pin.length) {
                    dot.classList.add('filled');
                } else {
                    dot.classList.remove('filled');
                }
            });

            // Simulate unlock if complete
            if (pin.length === MAX_PIN_LENGTH) {
                setTimeout(() => {
                    // Visual feedback for success before hypothetically unlocking
                    dots.forEach(dot => {
                        dot.style.backgroundColor = '#60162e'; // Force primary color pulse
                        dot.style.transform = 'scale(1.2)';
                    });
                    setTimeout(() => {
                        // Reset for demo purposes
                        pin = "";
                        updateDots();
                        dots.forEach(dot => dot.style.transform = '');
                    }, 500);
                }, 100);
            }
        }

        function enterDigit(digit) {
            if (pin.length < MAX_PIN_LENGTH) {
                pin += digit;
                updateDots();
            }
        }

        function deleteDigit() {
            if (pin.length > 0) {
                pin = pin.slice(0, -1);
                updateDots();
            }
        }
    </script>
