<!-- Copy -->

<h2 class="font-display-lg text-display-lg text-on-surface">Almost there.</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-sm mx-auto">
                Datty is a shared space. Invite your partner to begin your journey together.
            </p>
</div>
<!-- Invite Code Section -->
<div class="w-full bg-surface-container rounded-xl p-lg space-y-md shadow-[0_8px_32px_rgba(96,22,46,0.05)] border border-outline-variant/30">
<label class="block font-label-md text-label-md text-on-surface-variant uppercase tracking-wider text-sm">Your Unique Invite Code</label>
<div class="flex items-center justify-between bg-surface-container-lowest border border-outline-variant/50 rounded-lg overflow-hidden focus-within:border-primary transition-colors">
<span class="font-body-lg text-body-lg text-on-surface tracking-widest pl-4 py-3 select-all" id="invite-code">DATTY-7A9X</span>
<button class="p-3 text-primary hover:bg-primary-container/10 transition-colors flex items-center justify-center active:scale-95 duration-200" onclick="copyCode()">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">content_copy</span>
</button>
</div>
<p class="text-xs text-primary opacity-0 transition-opacity h-4" id="copy-feedback">Copied to clipboard!</p>
</div>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md rounded-lg py-4 flex items-center justify-center space-x-2 shadow-[0_4px_12px_rgba(96,22,46,0.2)] hover:opacity-90 active:scale-95 duration-200 transition-all">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">send</span>
<span>Share Invite Link</span>
</button>

        </button>

<!-- Bottom Navigation Suppressed as requested -->
<style>
        .animate-pulse-slow {
            animation: pulse-glow 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse-glow {
            0%, 100% {
                box-shadow: 0 0 40px rgba(152,66,89,0.15);
                transform: scale(1);
            }
            50% {
                box-shadow: 0 0 60px rgba(152,66,89,0.25);
                transform: scale(1.02);
            }
        }
    </style>
<script>
        function copyCode() {
            const code = document.getElementById('invite-code').innerText;
            navigator.clipboard.writeText(code).then(() => {
                const feedback = document.getElementById('copy-feedback');
                feedback.classList.remove('opacity-0');
                feedback.classList.add('opacity-100');
                
                setTimeout(() => {
                    feedback.classList.remove('opacity-100');
                    feedback.classList.add('opacity-0');
                }, 2000);
            });
        }
    </script>
